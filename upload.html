<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upload Video</title>

<style>
body{
    margin:0;
    font-family:"Segoe UI";
    background-image:url("{{ url_for('static', filename='background.jpg') }}");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}

.main{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:480px;
    background:rgba(255,255,255,0.95);
    border-radius:16px;
    box-shadow:0 15px 30px rgba(0,0,0,.25);
}

.card-header{
    text-align:center;
    padding:25px;
    color:white;
    background:linear-gradient(135deg,#d2b48c,#c19a6b);
}

.card-body{
    padding:30px;
    text-align:center;
}

input[type=file]{
    width:100%;
    padding:12px;
    border-radius:25px;
    border:1px solid #ddd;
    margin:20px 0;
}

.btn{
    width:100%;
    padding:12px;
    border-radius:25px;
    border:none;
    background:linear-gradient(135deg,#d2b48c,#c19a6b);
    color:white;
    font-weight:bold;
}

.links a{
    color:#8b5a2b;
    font-weight:600;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="main">
<div class="card">
<div class="card-header">
<img src="/static/logo1.png" width="120">
<h3>ST. ANN'S COLLEGE OF ENGINEERING & TECHNOLOGY</h3>
</div>

<div class="card-body">
<form method="POST" enctype="multipart/form-data">
<input type="file" name="video" multiple required>
<button class="btn">UPLOAD</button>
</form>

<div class="links">
<a href="/logout">Logout</a>
</div>
</div>
</div>
</div>

</body>
</html>
